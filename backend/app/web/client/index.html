<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f5bea">
  <title>Flow Demo Client</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="client.css">
</head>
<body>
  <main class="shell">
    <!-- Auth -->
    <section id="auth" class="card stack hidden">
      <h1>Flow Image Demo</h1>
      <p class="muted small">Web client mô phỏng ứng dụng mobile: đăng ký, tạo ảnh, theo dõi realtime.</p>
      <div>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" placeholder="ban@example.com">
      </div>
      <div>
        <label for="password">Mật khẩu (≥ 10 ký tự)</label>
        <input id="password" type="password" autocomplete="current-password">
      </div>
      <div class="row">
        <button id="btn-login">Đăng nhập</button>
        <button id="btn-register" class="secondary">Đăng ký</button>
      </div>
      <p id="auth-error" class="small error-text" role="alert"></p>
    </section>

    <!-- App -->
    <section id="main" class="hidden">
      <header class="topbar card">
        <div>
          <div class="small muted" id="who"></div>
          <div class="credits"><strong id="credits-available">—</strong> <span class="muted small">credit khả dụng</span>
            <span class="muted small" id="credits-reserved"></span></div>
        </div>
        <div class="spacer"></div>
        <div class="conn small" title="Trạng thái realtime"><span id="conn-dot" class="dot"></span> <span id="conn-text">…</span></div>
        <button id="btn-logout" class="secondary small">Thoát</button>
      </header>

      <form id="create" class="card stack">
        <h2>Tạo ảnh</h2>
        <div>
          <label for="prompt">Prompt</label>
          <textarea id="prompt" maxlength="2000" required>A cinematic futuristic city at dusk</textarea>
          <div class="chips" aria-label="Kịch bản thử lỗi">
            <span class="small muted">Thử kịch bản:</span>
            <button type="button" class="chip" data-token="[mock:fail]">lỗi provider</button>
            <button type="button" class="chip" data-token="[mock:limit]">bị giới hạn</button>
            <button type="button" class="chip" data-token="[mock:auth]">cần đăng nhập</button>
            <button type="button" class="chip" data-token="[mock:slow]">chậm 5s</button>
          </div>
        </div>
        <div class="grid2">
          <div>
            <label for="aspect">Tỉ lệ</label>
            <select id="aspect">
              <option>1:1</option><option selected>16:9</option><option>9:16</option><option>4:3</option><option>3:4</option>
            </select>
          </div>
          <div>
            <label for="count">Số ảnh</label>
            <select id="count"><option>1</option><option selected>2</option><option>3</option><option>4</option></select>
          </div>
        </div>
        <button id="btn-create" type="submit">Tạo ảnh</button>
      </form>

      <section class="card stack">
        <div class="row">
          <h2>Kiểm tra tải</h2>
          <div class="spacer"></div>
          <select id="stress-n" class="narrow" aria-label="Số job">
            <option value="5">5 job</option><option value="10" selected>10 job</option><option value="20">20 job</option>
          </select>
          <button id="btn-stress" class="secondary">Chạy</button>
        </div>
        <p class="small muted">Gửi đồng thời nhiều job (mỗi job 1 ảnh) và đo thời gian thực tế qua WebSocket.</p>
        <div id="stress-result" class="metrics hidden"></div>
      </section>

      <section class="stack">
        <div class="row"><h2>Lịch sử</h2><div class="spacer"></div>
          <button id="btn-refresh" class="secondary small">Làm mới</button></div>
        <div id="jobs" class="stack"></div>
        <button id="btn-more" class="secondary hidden">Xem thêm</button>
      </section>
    </section>
  </main>
  <script type="module" src="client.js"></script>
</body>
</html>
